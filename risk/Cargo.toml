[package]
name = "nanobook-risk"
version = "0.6.3"
edition = "2024"
rust-version = "1.86"
description = "Pre-trade risk checks for nanobook orders and target-weight rebalances"
license = "MIT"
repository = "https://github.com/BoringQuantSystems/nanobook"
homepage = "https://github.com/BoringQuantSystems/nanobook"
documentation = "https://docs.rs/nanobook-risk"

[dependencies]
nanobook = { version = "0.17", path = "..", features = ["serde"] }
nanobook-broker = { version = "0.8.0", path = "../broker" }
rustc-hash = "2.1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
