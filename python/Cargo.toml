[package]
name = "nanobook-python"
version = "0.17.1"
edition = "2024"
publish = false

[lib]
name = "nanobook_python"
crate-type = ["cdylib"]

[features]
default = ["scenarios"]
itch = ["nanobook/itch"]
binance = ["nanobook-broker/binance"]
scenarios = ["nanobook/scenarios"]

[dependencies]
nanobook = { path = "..", features = ["event-log", "serde", "persistence", "portfolio", "parallel", "scenarios"] }
nanobook-broker = { path = "../broker", features = ["ibkr"] }
nanobook-risk = { path = "../risk" }
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
serde_json = "1"

[build-dependencies]
pyo3-build-config = "0.29"
