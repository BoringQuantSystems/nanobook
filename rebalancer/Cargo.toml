[package]
name = "nanobook-rebalancer"
version = "0.9.0"
edition = "2024"
rust-version = "1.88"
description = "Target-weight rebalancer for Interactive Brokers with risk checks and audit logs"
license = "MIT"
repository = "https://github.com/BoringQuantSystems/nanobook"
homepage = "https://github.com/BoringQuantSystems/nanobook"
documentation = "https://docs.rs/nanobook-rebalancer"

[[bin]]
name = "rebalancer"
path = "src/main.rs"

[lib]
name = "nanobook_rebalancer"
path = "src/lib.rs"

[dependencies]
nanobook = { version = "0.18", path = "..", features = ["portfolio", "serde"] }
nanobook-broker = { version = "0.9.0", path = "../broker", features = ["ibkr"] }
nanobook-risk = { version = "0.7.0", path = "../risk" }
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tracing-log = "0.2"
rustc-hash = "2.1"
anyhow = "1.0"
dialoguer = "0.12"
nix = { version = "0.31", features = ["signal"] }
signal-hook = "0.4"
fs2 = "0.4"

[features]
default = []
write_ahead_logging = []
guaranteed_kill_switch = []

[dev-dependencies]
tempfile = "3"

[lints.clippy]
# Our dollar.cents digit grouping convention (e.g. 100_00 = $100.00). Declared
# here rather than as a crate-root attribute because every file under tests/ is
# its own crate root, so an attribute in lib.rs cannot reach the integration
# tests -- which is where most of these literals live.
inconsistent_digit_grouping = "allow"
