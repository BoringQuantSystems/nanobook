version: 2
updates:

  - package-ecosystem: "cargo"
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      # ibapi 3+ changes the IBKR client API; the order-handling migration
      # is its own piece of work (branch wip/ibapi-5-migration).
      - dependency-name: "ibapi"
        versions: [">=3.0.0"]
      # uuid 1.27+ needs Rust 1.89; the workspace MSRV is 1.88.
      - dependency-name: "uuid"
        versions: [">=1.27.0"]
    groups:
      cargo-updates:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions-updates:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/examples/itch-replay"
    open-pull-requests-limit: 5
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      pip-examples-itch-replay-updates:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/examples/momentum-backtest"
    open-pull-requests-limit: 5
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      pip-examples-momentum-backtest-updates:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/tests/parity"
    open-pull-requests-limit: 5
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      pip-tests-parity-updates:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/python"
    open-pull-requests-limit: 5
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      uv-python-updates:
        patterns:
          - "*"
