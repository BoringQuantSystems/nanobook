version: 2
updates:

  - package-ecosystem: "cargo"
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: monthly
    groups:
      cargo-updates:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/broker"
    open-pull-requests-limit: 5
    schedule:
      interval: monthly
    groups:
      cargo-broker-updates:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/fuzz"
    open-pull-requests-limit: 5
    schedule:
      interval: monthly
    groups:
      cargo-fuzz-updates:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/python"
