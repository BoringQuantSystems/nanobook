name: OCaml Oracle Differential Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  oracle:
    name: Test OCaml oracle against Rust implementation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      
      - name: Install OCaml
        uses: ocaml/setup-ocaml@e32b06a3e831ff2fbc6f08cf35be2085e3918014 # v3.6.1
        with:
          ocaml-compiler: 5.4
      
      - name: Cache opam
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.opam
          key: ${{ runner.os }}-opam-${{ hashFiles('**/oracle-ocaml/dune-project') }}
      
      - name: Install OCaml dependencies
        run: |
          cd oracle-ocaml
          opam install . --deps-only --with-test
      
      - name: Build OCaml oracle
        run: |
          cd oracle-ocaml
          opam exec -- dune build
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # master @ 2026-05-21
        with:
          toolchain: stable
      
      - name: Cache Rust
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build Rust project
        run: cargo build --release --features serde --bin corpus-replay
      
      - name: Run differential tests
        run: |
          set -euo pipefail
          for case in oracle-ocaml/test/corpus/*/; do
            [ -f "$case/input.jsonl" ] || continue
            name=$(basename "$case")
            opam exec -- dune exec --root oracle-ocaml bin/replay_bin.exe -- "$case/input.jsonl" "/tmp/ocaml-$name.jsonl"
            ./target/release/corpus-replay "$case/input.jsonl" "/tmp/rust-$name.jsonl"
            diff -u "$case/output.jsonl" "/tmp/ocaml-$name.jsonl"
            diff -u "$case/output.jsonl" "/tmp/rust-$name.jsonl"
            echo "ok $name"
          done
      
      - name: Test OCaml oracle library
        run: |
          cd oracle-ocaml
          opam exec -- dune runtest --force