name: Security audit

# Split out of ci.yml so it can run on a schedule. Inside CI this job only
# fired on push/PR, which meant an advisory filed against an unchanged
# Cargo.lock stayed invisible until someone happened to push. A quiet week
# is exactly when that gap matters.
#
# Scheduling the whole CI file instead would drag 13 jobs along weekly for
# the sake of two `cargo` invocations, so the audit lives here on its own.
on:
  schedule:
    # Mondays 06:17 UTC. Off the hour on purpose: GitHub drops scheduled
    # runs under load, and :00 is the most contended minute of the hour.
    - cron: '17 6 * * 1'
  push:
    branches: [main, dev]
    # Dependency-graph inputs only. Source changes cannot introduce an
    # advisory, and re-auditing an unchanged lockfile on every push tells
    # us nothing the last run didn't.
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/audit.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/audit.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable @ 2026-05-21

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: audit

      # Pin tool versions (I1). --locked also freezes the tool's
      # own transitive deps, so the install is fully
      # deterministic. Bump versions deliberately rather than
      # letting CI silently pick up whatever is latest.
      #
      # rust-cache restores ~/.cargo/bin, so these installs are usually
      # no-ops. The advisory database is still cloned fresh on every run,
      # so a cached binary does not mean stale advisories.
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.4 --locked

      - name: Run cargo-deny
        run: cargo deny check

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked

      - name: Run cargo-audit
        run: cargo audit
